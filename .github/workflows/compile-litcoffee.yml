name: Compile LitCoffee

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 2
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install CoffeeScript
      run: npm install -g coffeescript
    
    - name: Compile LitCoffee files
      run: coffee --compile dh-converter.litcoffee
    
    - name: Check for changes
      id: verify_diff
      run: |
        git diff --exit-code dh-converter.js || echo "changed=true" >> $GITHUB_OUTPUT
    
    - name: Commit compiled files
      if: steps.verify_diff.outputs.changed == 'true' && github.event_name == 'push'
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add dh-converter.js
        git commit -m "Auto-compile dh-converter.litcoffee"
    
    - name: Push changes
      if: steps.verify_diff.outputs.changed == 'true' && github.event_name == 'push'
      uses: ad-m/github-push-action@v0.6.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ github.ref }}
    
    - name: Fail if compiled file is out of date
      if: steps.verify_diff.outputs.changed == 'true' && github.event_name == 'pull_request'
      run: |
        echo "Error: dh-converter.js is out of date. Please run 'coffee --compile dh-converter.litcoffee' and commit the changes."
        exit 1
